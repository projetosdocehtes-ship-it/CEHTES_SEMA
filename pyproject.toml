exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    ".venv",
    "cms/*",
    "core/*",
    "scritps/*",
    "scripts/*",
    "tasks_scripts/*",
    "apps/tasks/*",
    "apps/tables/*",
    "apps/tables/migrations/*",
    "**/migrations/*",
]


# Allow unused variables when underscore-prefixed.
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
docstring-code-format = true


# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.flake8]
# Check that this is aligned with your other tools like Black
max-line-length = 88
exclude = [
    # No need to traverse our git directory
    ".git",
    # There's no value in checking cache directories
    "__pycache__"
]
# Use extend-ignore to add to already ignored checks which are anti-patterns like W503.
extend-ignore = [
    # PEP 8 recommends to treat : in slices as a binary operator with the lowest priority, and to leave an equal
    # amount of space on either side, except if a parameter is omitted (e.g. ham[1 + 1 :]).
    # This behaviour may raise E203 whitespace before ':' warnings in style guide enforcement tools like Flake8.
    # Since E203 is not PEP 8 compliant, we tell Flake8 to ignore this warning.
    # https://black.readthedocs.io/en/stable/the_black_code_style/current_style.html#slices
    "E203", "E501"
]

[tool.pylint.lint]
dummy-variable-rgx = "_|dummy"
fixable = true
ignore = ["CVS", "__pycache__"]
select = "C,E,F,W"
unfixable = ["F001"]

[tool.pylint.messages_control]
disable = "C0103,C0114,C0115,C0116"

[tool.pylint.FORMAT]
max-line-length = 88

# Maximum number of lines in a module.
max-module-lines = 1000

[tool.pylint.REFACTORING]

# Maximum number of nested blocks for function / method body
max-nested-blocks = 5

# Complete name of functions that never returns. When checking for
# inconsistent-return-statements if a never returning function is called then
# it will be considered as an explicit return statement and no message will be
# printed.
never-returning-functions = 'sys.exit'



[tool.djlint]
profile="django"
ignore = "H021,T002,D018,H026,H030,H031,T003"

format_css=true

[tool.djlint.js]
indent_size=5

[tool.pyright]
include = ["*"]
exclude = [
    ".venv",
    "**/node_modules",
    "**/__pycache__",
    "src/experimental",
    "src/typestubs"
]
strict = ["*"]
venvPath = "."
venv = ".venv"
defineConstant = { DEBUG = true }
typeCheckingMode = "off"
reportMissingImports = true
reportMissingTypeStubs = true
reportOptionalMemberAccess = false
pythonVersion = "3.12"
pythonPlatform = "Windows"


[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
skip-string-normalization = false
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.djhtml]
tabwidth = 4
wrap = 88

[tool.isort]
profile = 'black'


blank_line_after_tag="load,extends,include"
blank_line_before_tag="load,extends,include"
close_void_tags=true
exclude=".venv,venv,.tox,.eggs,..."
format_attribute_template_tags=true
line_break_after_multiline_tag=true


[tool.djlint.format]
# Define o tamanho da indentação (4 espaços é uma prática comum)
indent = 4
# Configura a largura máxima de uma linha
line_length = 80
# Formata tags HTML
format_tags = true

[tool.djlint.css]
indent_size=5
