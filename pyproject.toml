fix = true

# Permite correções não seguras
unsafe-fixes = true

# Seletor de lint para verificar todos os códigos
lint.select = ["ALL"]

# Permite todas as correções possíveis
lint.fixable = ["ALL"]

# Lista de verificações que não devem ser corrigidas automaticamente
lint.unfixable = []
