"ANN101", # missing-return-type-class-method
"ANN206",
"D212", # multi-line-summary-first-line
"E501",
"D102",
"ANN204",
"S113",
"S311",
"S104",
"DJ006",
"ANN201",
"ANN401",
"T201", #Manter os prints
"S608", # sql injection
# "S603",
"D103", # Missing docstring in public function
"TRY300",
"ERA001",
"ANN001",
"D205",
"D401",
