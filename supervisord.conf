[unix_http_server]
file=/tmp/supervisor.sock   ; (the path to the socket file)

[supervisord]
logfile=/tmp/supervisord.log ; (main log file; default $CWD/supervisord.log)
pidfile=/tmp/supervisord.pid ; (supervisord pidfile; default supervisord.pid)
childlogdir=/tmp/           ; ('AUTO' child log dir, default $TEMP)

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock ; use a unix:// URL  for a unix socket

[program:django]
command=python manage.py runserver 0.0.0.0:8000
directory=/caminho/para/o/seu/projeto
autostart=true
autorestart=true
stderr_logfile=/var/log/django.err.log
stdout_logfile=/var/log/django.out.log

[program:celeryworker]
command=celery -A nome_do_seu_projeto worker -l info
directory=/caminho/para/o/seu/projeto
autostart=true
autorestart=true
stderr_logfile=/var/log/celery_worker.err.log
stdout_logfile=/var/log/celery_worker.out.log

[program:celerybeat]
command=celery -A nome_do_seu_projeto beat -l info
directory=/caminho/para/o/seu/projeto
autostart=true
autorestart=true
stderr_logfile=/var/log/celery_beat.err.log
stdout_logfile=/var/log/celery_beat.out.log
