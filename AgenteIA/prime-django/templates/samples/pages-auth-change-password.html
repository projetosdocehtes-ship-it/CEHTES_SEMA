{% extends "layouts/base-fullscreen.html" %}
{% block title %}Auth{% endblock %}
<!-- Specific CSS goes HERE -->
{% block stylesheets %}
{% endblock stylesheets %}
{% block content %}
    <div class="auth-wrapper">
        <div class="auth-content">
            <div class="auth-bg">
                <span class="r"></span>
                <span class="r s"></span>
                <span class="r s"></span>
                <span class="r"></span>
            </div>
            <div class="card">
                <div class="card-body text-center">
                    <h5 class="mb-4">Senha</h5>
                    <div class="input-group mb-3">
                        <input type="password" class="form-control" placeholder="Senha atual">
                    </div>
                    <div class="input-group mb-3">
                        <input type="password" class="form-control" placeholder="Nova Senha">
                    </div>
                    <div class="input-group mb-4">
                        <input type="password"
                               class="form-control"
                               placeholder="Digite novamente a nova senha">
                    </div>
                    <button class="btn btn-sm btn-primary shadow-2 mb-4">Alterar a senha</button>
               {% comment %} <p class="mb-0 text-muted">
                  Não tenho uma conta? <a href="/pages-auth-signup.html">Signup</a>
               </p> {% endcomment %}
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
{% block javascripts %}
{% endblock javascripts %}
