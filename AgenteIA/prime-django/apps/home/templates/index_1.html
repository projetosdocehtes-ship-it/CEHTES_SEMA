<html>
    <head>
        <title>PrimeRI - Gerenciador - Check list</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" %}'>
                                                                                                               <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
                                                                                                               <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
                                                                                                               <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
                                                                                                               <script>
                                                                                                               $(document).ready(function() {
                                                                                                               $("#b1").click(function() {
                                                                                                               $(".rb").show();
                                                                                                               $(".rb").attr("disabled", true);


                                                                                                               });
                                                                                                               });


                                                                                                               function getanswers() {
                                                                                                               document.getElementById("UserAnswers").innerHTML = "";
                                                                                                               var e = document.getElementsByTagName("input");
                                                                                                               for (i = 0; i <= e.length; i++) {
                                                                                                               if (e[i].type == "radio") {
                                                                                                               if (e[i].checked) {
                                                                                                               document.getElementById("UserAnswers").innerHTML += "Q " + e[i].name + " As respostas que você selecionou são : " + e[i].value + "<br>";

                                                                                                               }
                                                                                                               }
                                                                                                               }
                                                                                                               }
                                                                                                               </script>
                                                                                                               </head>
                                                                                                               <body>
                                                                                                               <div class="container">
                                                                                                               <h1 class="text-danger mt-3">Lista de Controle: Matrícula 000.000</h1>
                                                                                                               <hr>
                                                                                                               <div>
                                                                                                               {% for i in  perguntas %}
                                                                                                                   <table class="table">
                                                                                                                   <tr>
                                                                                                                   <td class="text-primary">{{ i.id }} - {{ i.questions }} ?</td>
                                                                                                                   </tr>
                                                                                                                   <tr>
                                                                                                                   <td>
                                                                                                                   <input type="radio" class="rb" name={{ i.id }} id="option1" value="{{ i.option1 }}"> {{ i.option1 }}
                                                                                                                   </td>
                                                                                                                   </tr>
                                                                                                                   <tr>
                                                                                                                   <td>
                                                                                                                   <input type="radio" class="rb" name={{ i.id }} id="option2" value="{{ i.option2 }}"> {{ i.option2 }}
                                                                                                                   </td>
                                                                                                                   </tr>
                                                                                                                   <tr>
                                                                                                                   <td>
                                                                                                                   <input type="radio" class="rb" name={{ i.id }} id="option3" value="{{ i.option3 }}"> {{ i.option3 }}
                                                                                                                   </td>
                                                                                                                   </tr>
                                                                                                                   <tr>
                                                                                                                   <td>
                                                                                                                   <input type="radio" class="rb" name={{ i.id }} id="option4" value="{{ i.option4 }}"> {{ i.option4 }}
                                                                                                                   </td>
                                                                                                                   </tr>
                                                                                                                   <tr>
                                                                                                                   <td>
                                                                                                                   <label id="corans" class="rb" style="display:none ; color : green">
                                                                                                                   <b>{{ i.Corrans }}</b>
                                                                                                                   </label>
                                                                                                                   </td>
                                                                                                                   </tr>
                                                                                                                   </table>
                                                                                                                   <hr>
                                                                                                               {% endfor %}
                                                                                                               <input type="submit"
                                                                                                               class="btn btn-sm btn-primary btn-lg"
                                                                                                               value="Salvar"
                                                                                                               id="b1"
                                                                                                               onclick="getanswers()">
                                                                                                               <input type="submit"
                                                                                                               class="btn btn-warning btn-lg"
                                                                                                               value="Cancelar"
                                                                                                               id="b2"
                                                                                                               onclick="javascript:window.location='http://127.0.0.1:8000/protocolos/?numero_protocolo=140000';">
                                                                                                             <br>
                                                                                                             <b id="UserAnswers"></b>
                                                                                                             </div>
                                                                                                             </div>
                                                                                                             </body>
                                                                                                             </html>
