{% extends "layouts/base.html" %}
{% load static %}
{% block breadcrumbs %}
{% endblock breadcrumbs %}
{% block content %}
    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-header">
                    <h5>Assinar Documento</h5>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-file-signature"></i>Assinar Documento
                        </button>
                        <a href="{% url 'documento_list' %}" class="btn btn-secondary">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
