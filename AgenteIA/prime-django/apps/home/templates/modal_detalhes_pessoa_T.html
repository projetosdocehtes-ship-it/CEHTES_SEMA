{% load home_formatos %}
<!-- Modal -->
<div class="modal"
     id="modal_detalhes_pessoa_T{{ partesT.pessoa.id }}"
     tabindex="-1"
     aria-labelledby="editModalLabel"
     aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header" style="background:#000">
                <h1 class="modal-title text-white fs-5" id="editModalLabel">
                    <i class="icon feather icon-edit"></i>   Última edição: {{ partesT.pessoa.data_alteracao|date:"D, d M Y H:i" }}
                    <p>
                        {{ partesT.pessoa.nome }} - {{ partesT.pessoa.cpf|default:""|formatar_documento }}
                    </h1>
                    <button type="button"
                            class="icon feather icon-window-close"
                            data-bs-dismiss="modal"
                            aria-label="Close"></button>
                </div>
                <form action="#" method="post">
                    {% csrf_token %}
                    <div class="modal-body" style="background:#cdc9c9;">
                        <input type="hidden" name="parte_id" value="{{ partesT.pessoa.id }}" />
                        {% if partesT.pessoa.nome == '' %}
                            <div class="form-floating mb-1">
                                <input type="text"
                                       class="form-control"
                                       name="nome"
                                       id="floatingInput"
                                       placeholder="Nome"
                                       value="{{ partesT.pessoa.nome }}" />
                                <label for="floatingInput">Nome</label>
                            </div>
                            <div class="row">
                                <br>
                            </div>
                        {% endif %}
                        <div class="form-floating mb-1">
                            <!-- Inicio - dos GRUPOS na mesma linha -->
                            <div class="row">
                                <div class="col-lg-5">
                                    <div class="form-group">
                                        <div class="form-floating mb-1">
                                            <input type="text"
                                                   class="form-control"
                                                   name="documento"
                                                   id="floatingInput"
                                                   placeholder="Documento"
                                                   value="{{ partesT.pessoa.documento }}"
                                                   autofocus
                                                   required="" />
                                            <label for="floatingInput">Documento (RG, CNH)</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-lg-3">
                                    <div class="form-group">
                                        <!-- OBTER O COMBOBOX DE ESTADO_CIVIL -->
                                        <div class="form-floating mb-1">
                                            <select class="form-select" name="estado_civil" id="estado_civil">
                                                <option value="{{ partesT.pessoa.estado_civil }}" selected>
                                                    {{ partesT.pessoa.estado_civil|get_descricao_estado_civil }}
                                                </option>
                                                {% if partesT.pessoa.estado_civil %}
                                                    {% for estado_civil in partesT.pessoa.estado_civil|lista_estado_civil %}
                                                        <option value="{{ estado_civil.0 }}">{{ estado_civil.1 }}</option>
                                                    {% endfor %}
                                                {% else %}
                                                {% endif %}
                                            </select>
                                            <label for="floatingInput">Estado Civil</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-lg-4">
                                    <div class="form-group">
                                        <!-- OBTER O COMBOBOX DE TipoRegimeCasamento -->
                                        <div class="form-floating mb-1">
                                            <select class="form-select"
                                                    name="tipo_regime_casamento"
                                                    id="tipo_regime_casamento">
                                                <option value="{{ partesT.pessoa.estado_civil_regime_id }}" selected>
                                                    {{ partesT.pessoa.estado_civil_regime_id|get_descricao_tipo_regime_casamento }}
                                                </option>
                                                {% for tipo_regime_casamento in ''|lista_tipo_regime_casamento %}
                                                    <option value="{{ tipo_regime_casamento.0 }}">{{ tipo_regime_casamento.1 }}</option>
                                                {% endfor %}
                                            </select>
                                            <label for="floatingInput">Regime de Bens</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- FIM - dos GRUPOS na mesma linha -->
                        </div>
                        <!-- Inicio - dos GRUPOS na mesma linha -->
                        <div class="row">
                            <div class="col-lg-3">
                                <div class="form-group">
                                    <!-- OBTER O COMBOBOX DE SEXO -->
                                    <div class="form-floating mb-1">
                                        <select class="form-select form-select-sm" name="sexo" id="sexo">
                                            <option value="{{ partesT.pessoa.sexo }}" selected>{{ partesT.pessoa.sexo|formato_sexo }}</option>
                                            {% if partesT.pessoa.sexo|lista_sexo %}
                                                {% for item in partesT.pessoa.sexo|lista_sexo %}<option value="{{ item.0 }}">{{ item.1 }}</option>{% endfor %}
                                            {% else %}
                                            {% endif %}
                                        </select>
                                        <label for="floatingInput">Sexo</label>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="form-group">
                                    <div class="form-floating mb-1">
                                        <input type="text" class="form-control" name="data_nascimento" id="floatingInput" placeholder="Data de Nascimento" value="{{ partesT.pessoa.data_nascimento|date:"d/m/y" }}" />
                                        <label for="floatingInput">Data de Nascimento</label>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="form-group">
                                    <div class="form-floating mb-1">
                                        <input type="text"
                                               class="form-control"
                                               name="profissao"
                                               id="floatingInput"
                                               placeholder="profissao"
                                               value="{{ partesT.pessoa.profissao }}" />
                                        <label for="floatingInput">Profissão</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- FIM - dos GRUPOS na mesma linha -->
                        <!-- Inicio - dos GRUPOS na mesma linha -->
                        <div class="row">
                            <div class="col-lg-12">
                                <div class="form-group">
                                    <div class="form-floating mb-1">
                                        <input type="text"
                                               class="form-control"
                                               name="endereco"
                                               id="floatingInput"
                                               placeholder="endereco"
                                               value="{{ partesT.pessoa.endereco }}" />
                                        <label for="floatingInput">Endereço</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- FIM - dos GRUPOS na mesma linha -->
                        <!-- Inicio - dos GRUPOS na mesma linha -->
                        <div class="row">
                            <div class="col-lg-6">
                                <div class="form-group">
                                    <div class="form-floating mb-1">
                                        <input type="text"
                                               class="form-control"
                                               name="nacionalidade"
                                               id="floatingInput"
                                               placeholder="nacionalidade"
                                               value="{{ partesT.pessoa.nacionalidade }}" />
                                        <label for="floatingInput">Nacionalidade</label>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="form-group">
                                    <div class="form-floating mb-1">
                                        <input type="text"
                                               class="form-control"
                                               name="naturalidade"
                                               id="floatingInput"
                                               placeholder="naturalidade"
                                               value="{{ partesT.pessoa.naturalidade }}" />
                                        <label for="floatingInput">Naturalidade</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- FIM - dos GRUPOS na mesma linha -->
                        <!-- Inicio - dos GRUPOS na mesma linha -->
                        <div class="row">
                            <div class="col-lg-6">
                                <div class="form-group">
                                    <div class="form-floating mb-1">
                                        <input type="text"
                                               class="form-control"
                                               name="nome_pai"
                                               id="floatingInput"
                                               placeholder="Nome do pai"
                                               value="{{ partesT.pessoa.nome_pai }}" />
                                        <label for="floatingInput">Nome Pai</label>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="form-group">
                                    <div class="form-floating mb-1">
                                        <input type="text"
                                               class="form-control"
                                               name="nome_mae"
                                               id="floatingInput"
                                               placeholder="Nome da mãe"
                                               value="{{ partesT.pessoa.nome_mae }}" />
                                        <label for="floatingInput">Nome Mãe</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- FIM - dos GRUPOS na mesma linha -->
                        <!-- Inicio - dos GRUPOS na mesma linha -->
                        <div class="row">
                            <div class="col-lg-6">
                                <div class="form-group">
                                    <div class="form-floating mb-1">
                                        <input type="text"
                                               class="form-control"
                                               name="email"
                                               id="floatingInput"
                                               placeholder="email"
                                               value="{{ partesT.pessoa.email }}" />
                                        <label for="floatingInput">e-mail</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- FIM - dos GRUPOS na mesma linha -->
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-sm btn-primary">
                            <i class="icon feather icon-save"></i> Salvar
                        </button>
                        <button type="button"
                                class="btn btn-sm btn-secondary"
                                data-bs-dismiss="modal">
                            <i class="icon feather icon-window-close"></i> Fechar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
