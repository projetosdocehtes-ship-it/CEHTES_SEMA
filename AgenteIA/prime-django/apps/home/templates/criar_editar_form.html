{% extends "layouts/base.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block content %}
    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-header">
                    {% if object %}
                        <h5>Editar</h5>
                    {% else %}
                        <h5>Adicionar</h5>
                    {% endif %}
                </div>
                <div class="card-block">
                    <form method="post" action="{{ form_action }}">
                        {% csrf_token %}
                        <input type="hidden" name="pedido_item_id" value="{{ pedido_item_id }}">
                        <input type="hidden" name="ancora" value="{{ ancora_origem }}">
                        {% crispy form %}
                    </form>
                    {% comment %} <a href="{% url 'home:checklist_lv2' pedido_item_id=pedido_item_id opcao=1 %}" class="btn btn-sm btn-secondary">Cancelar</a> {% endcomment %}
                </div>
                {% comment %} <div class="card-footer">
          <a href="{% url 'home:checklist_lv2' pedido_item_id=pedido_item_id opcao=1 %}" class="btn btn-sm btn-secondary">Voltar</a>
                </div> {% endcomment %}
            </div>
        </div>
    </div>
{% endblock content %}
