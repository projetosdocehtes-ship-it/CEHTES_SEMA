{% load home_formatos %}
<!-- Modal -->
<div class="modal"
     id="modal_atos_parte_protocolo_t{{ partesT.pessoa.id }}"
     tabindex="-1"
     role="dialog"
     aria-labelledby="myModalLabel">
    <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header" style="background:#000">
                <h4 class="modal-title text-white" id="myModalLabel">
                    <i class="icon feather icon-edit"></i>  Alterando dados para o Transmitente 8888:
                    <p>{{ partesT.pessoa.nome }} - {{ partesT.pessoa.cpf|default:""|formatar_documento }}</p>
                </h4>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body" style="background:#cdc9c9;">
                <form action="{% url 'home:editModalAtoParteTPartesProtocolo' %}"
                      method="post">
                    {% csrf_token %}
                    <input type="hidden" name="parte_idT" value="{{ partesT.pessoa.id }} " />
                    <input type="hidden" name="pedido_item_idT"      value="866470" />
                    <!-- OBTER O COMBOBOX DOS ATOS DA MATRICULA -->
                    <label for="ato_transmitir" style="font-size:14px;text-align:center;">Número do Ato (baixar)</label>
                    <div class="form-floating mb-1">
                        <select class="form-select form-select-sm"
                                name="ato_transmitir"
                                id="ato_transmitir">
                            <option value="{{ 866470|Exibir_Pedidos_Partes_Ato_02 }}" selected>{{ 866470|Exibir_Pedidos_Partes_Ato_02 }}</option>
                            {% if 866470|get_vinculos_livro02 %}
                                {% for pedido_item in 866470|get_vinculos_livro02 %}
                                    <option value="{{ pedido_item.0 }}">
                                        {{ pedido_item.1 }}.{{ pedido_item.2|numero_inteiro }}
                                        {{ pedido_item.3 }} {{ pedido_item.4|get_cpf|formatar_documento }} {{ pedido_item.4|get_nome_da_pessoa_pelo_id }}
                                    </option>
                                {% endfor %}
                            {% else %}
                            {% endif %}
                        </select>
                    </div>
                    <br>
                    <div class="form-floating mb-1">
                        <input type="text"
                               class="form-control"
                               name="percentual_ato"
                               id="percentual_ato"
                               placeholder="Informe o Percentual do ATO"
                               value="{{ partesT.percentual_ato }}"
                               autofocus
                               required="true"
                               oninput="this.value=this.value.replace(/[^0-9,]/g, '').replace(/(\..*?)\..*/g, '$1');" />
                        <label for="percentual_ato">Informe o Percentual do ATO</label>
                    </div>
                    <br>
                    <div class="form-floating mb-1">
                        <input type="text"
                               class="form-control"
                               name="percentual_doi"
                               id="percentual_doi"
                               placeholder="Informe o Percentual para a DOI"
                               value="{{ partesT.percentual_doi }}"
                               autofocus
                               required="true"
                               oninput="this.value=this.value.replace(/[^0-9,]/g, '').replace(/(\..*?)\..*/g, '$1');" />
                        <label for="percentual_doi">Informe o Percentual para a DOI</label>
                    </div>
                    <br>
                    <!-- OBTER O COMBOBOX DO CONJUGUE -->
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="form-group">
                                <div class="input-group mb-6">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text">Conjugue</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-sm btn-primary">
                        <i class="icon feather icon-save"></i> Salvar
                    </button>
                    <button type="button"
                            class="btn btn-sm btn-secondary"
                            data-bs-dismiss="modal">
                        <i class="btn-close"></i> Fechar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</div>
