{% comment %} {% load widget_tweaks %} {% endcomment %}
{% comment %} <!--   --> {% endcomment %}
{% block content %}
    <!-- Modal -->
    <div class="modal"
         id="modal-acesso-rapido-livro03-registro_auxiliar-id"
         tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addAdquirenteModalLabel">Registro Auxiliar - Livro 03</h5>
                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Fechar">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <!-- PASSANDO O NUMERO -->
                <form action="{% url 'home:abrir_livro03' %}" method="post">
                    <!-- Não se esqueça dessa tag -->
                    {% csrf_token %}
                    <div class="modal-body">
                        <!-- PASSANDO O PROTOCOLO -->
                        <input type="hidden" name="parte_id" id="parte_id" value="{{ Protocolo }}" />
                        <!-- NÚMERO -->
                        <div class="input-group mb-3">
                            <div class="input-group-prepend">
                                <span class="input-group-text">Número</span>
                            </div>
                            <input type="number"
                                   class="form-control"
                                   placeholder="digite o número"
                                   name="numero_informado"
                                   id="numero_informado"
                                   value=""
                                   required>
                        </div>
                        <!-- BOTOES -->
                        <div class="modal-footer">
                            <button type="submit"
                                    class="btn btn-sm btn-primary "
                                    aria-pressed="true"
                                    role="button">
                                <i class="icon feather icon-search"></i> Pesquisar
                            </button>
                            <button value=""
                                    type="button"
                                    class="btn btn-sm btn-secondary "
                                    data-bs-dismiss="modal">
                                <i class="btn-close"></i> Fechar
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
{% block javascripts %}
    <script>
        $(document).ready(function() {
            $("#modal-acesso-rapido-registro_auxiliar").on('shown.bs.modal', function() {
                $(this).find('#numero_informado').focus();
            });
        });
    </script>
{% endblock javascripts %}
