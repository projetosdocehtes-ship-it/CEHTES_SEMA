<a class="btn btn-sm btn-outline-primary mx-1 my-1"
   data-bs-toggle="modal"
   href="javascript:"
   data-bs-target="#myModal{{ adquirente.id }}"
   title="Alterar dados da pessoa selecionada"
   role="button">
    <i class="icon feather icon-file-minus"></i>&emsp;Alterar Ato
</a>
{% load home_formatos %}
<!-- Modal -->
<div class="modal"
     id="myModal{{ adquirente.id }}"
     tabindex="-1"
     role="dialog"
     aria-labelledby="myModalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header bg-dark">
                <h4 class="modal-title text-white" id="myModalLabel">
                    <i class="icon feather icon-edit"></i>  Alterando dados para o Adquirente:
                    <p>{{ adquirente.pessoa.nome }} - {{ adquirente.pessoa.cpf|default:""|formatar_documento }}</p>
                </h4>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <form action={% url 'home:editModalAtoParteA' %} method="post">
                {% csrf_token %}
                <div class="modal-body">
                    <input type="hidden" name="parte_idA" value="{{ adquirente.id }}" />
                    <input type="hidden"
                           name="pedido_item_idA"
                           value="{{ adquirente.pedido_item_id }}" />
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text">Percentual do ATO</span>
                        </div>
                        <input type="text"
                               class="form-control"
                               name="percentual_ato"
                               id="percentual_ato"
                               placeholder="Informe o Percentual do ATO"
                               value="{{ adquirente.percentual_ato }}"
                               autofocus
                               required="True"
                               oninput="this.value=this.value.replace(/[^0-9,]/g, '').replace(/(\..*?)\..*/g, '$1');" />
                    </div>
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text">Percentual para a DOI</span>
                        </div>
                        <input type="text"
                               class="form-control"
                               name="percentual_doi"
                               id="percentual_doi"
                               placeholder="Informe o Percentual para a DOI"
                               value="{{ adquirente.percentual_doi }}"
                               autofocus
                               required="True"
                               oninput="this.value=this.value.replace(/[^0-9,]/g, '').replace(/(\..*?)\..*/g, '$1');" />
                    </div>
                    <!-- OBTER O COMBOBOX DO CONJUGUE -->
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="form-group">
                                <div class="input-group mb-3">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text">Conjugue</span>
                                    </div>
                                    <select class="form-select" name="conjuge" id="conjuge" autofocus>
                                        {% if adquirente.pessoa_conjuge_id > 0 %}
                                            <option value="{{ adquirente.pessoa_conjuge_id }}">
                                                {{ adquirente.pessoa_conjuge.nome }}
                                        {% else %}
                                            <option value="0"></option>
                                        {% endif %}
                                        {% if adquirente.pedido_item_id != None %}
                                            {% for adquirente in adquirente.pedido_item_id|get_partes_do_pedido %}
                                                <option value="{{ adquirente.pessoa }}">{{ adquirente.pessoa.nome }}</option>
                                            {% endfor %}
                                        {% endif %}
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-sm btn-primary">
                        <i class="icon feather icon-save"></i> Salvar
                    </button>
                    <button type="button"
                            class="btn btn-sm btn-secondary"
                            data-bs-dismiss="modal">
                        <i class="btn-close"></i> Fechar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
