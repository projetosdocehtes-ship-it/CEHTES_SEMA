{% comment %} {% load widget_tweaks %} {% endcomment %}
<form method="post">
    <!-- Não se esqueça dessa tag -->
    {% csrf_token %}
    <!-- Nome -->
    <div class="input-group mb-3">
        <div class="input-group-prepend">
            <span class="input-group-text">Nome</span>
        </div>
        {% render_field form.nome class+="form-control" %}
    </div>
    <!-- Documento -->
    <div class="input-group mb-3">
        <div class="input-group-prepend">
            <span class="input-group-text">Documento</span>
        </div>
        {% render_field form.documento class+="form-control" %}
    </div>
    <!-- CPF -->
    <div class="input-group mb-3">
        <div class="input-group-prepend">
            <span class="input-group-text">CPF</span>
        </div>
        {% render_field form.cpf class+="form-control" %}
    </div>
    <hr>
    <div class="text-right">
        <button type="submit"
                class="btn btn-sm btn-primary "
                aria-pressed="true"
                role="button"
                title="Salvar os dados da Pessoa Selecionada"
                data-bs-toggle="tooltip">Salvar</button>
        <button value="" type="button" class="btn btn-danger" data-bs-dismiss="modal">Fechar</button>
    </div>
</form>
