{% extends "layouts/base.html" %}
{% load static crispy_forms_tags django_tables2 %}
{% block content %}
    <div class="row">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-header">
                    <h5>Apresentante</h5>
                </div>
                <div class="card-block">
                    <form method="post">
                        {% crispy form %}
                        <button type="submit" class="btn btn-sm btn-primary">Salvar</button>
                    </form>
                </div>
                <div class="card-footer"></div>
            </div>
        </div>
    </div>
    <!-- [ Main Content ] end -->
{% endblock content %}
