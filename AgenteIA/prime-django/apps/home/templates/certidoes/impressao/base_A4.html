<!DOCTYPE html>
<html lang="pt-br">
    {% load static %}
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="{% static 'assets/favicon.ico' %}">
        <title>
            {% block title %}Impressão de A4{% endblock %}
        </title>
        <!-- Estilos Básicos -->
        <style>
             /* Reset padrão para garantir consistência entre navegadores */
            html,
            body,
            div,
            span,
            applet,
            object,
            iframe,
            h1,
            h2,
            h3,
            h4,
            h5,
            h6,
            p,
            blockquote,
            pre,
            a,
            abbr,
            acronym,
            address,
            big,
            cite,
            code,
            del,
            dfn,
            em,
            img,
            ins,
            kbd,
            q,
            s,
            samp,
            small,
            strike,
            strong,
            sub,
            sup,
            tt,
            var,
            b,
            u,
            i,
            center,
            dl,
            dt,
            dd,
            ol,
            ul,
            li,
            fieldset,
            form,
            label,
            legend,
            table,
            caption,
            tbody,
            tfoot,
            thead,
            tr,
            th,
            td,
            article,
            aside,
            canvas,
            details,
            embed,
            figure,
            figcaption,
            footer,
            header,
            hgroup,
            menu,
            nav,
            output,
            ruby,
            section,
            summary,
            time,
            mark,
            audio,
            video {
                margin: 0;
                padding: 0;
                border: 0;
                font-size: 100%;
                font: inherit;
                vertical-align: baseline;
            }

             /* Estilos do impressão */
            body {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: Arial, sans-serif;
                background-color: #333;
            }

            .page {
                width: 210mm;
                min-height: 297mm;
                padding: 20mm;
                margin: auto;
                background: white;
                box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
            }

            @page {
                size: A4;
                margin: 0;
            }

            @media print {
                .page {
                    box-shadow: none;
                    margin: 0;
                    border: none;
                }
            }

            .recibo {
                page-break-before: always;
            }

            .via {
                height: 50%;
                width: 100%;
                border-bottom: 1px solid black;
            }

            .via:last-child {
                border-bottom: none;
            }
        </style>
        {% block stylesheets %}{% endblock %}
    </head>
    <body>
        <div class="page">
            <section>
                {% block content %}{% endblock %}
            </section>
            <footer>
                {% block footer %}<p>Informações de Rodapé</p>{% endblock %}
            </footer>
        </div>
        {% block javascripts %}{% endblock %}
    </body>
</html>
