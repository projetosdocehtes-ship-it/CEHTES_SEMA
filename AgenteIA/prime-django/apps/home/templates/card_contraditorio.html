{% load home_formatos %}
<div class="card" id="itens_pedido_contraditorio">
    <div class="card-header">
        <h5>
            <span class="font-weight-bold text-white">Contraditório: {{ protocolo }}</span>
        </h5>
    </div>
    <div class="card-body table-responsive">
        <table class="table table-hover">
            <thead>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
    <div class="card-footer">
        <button type="button"
                class="btn btn-sm btn-primary"
                data-bs-toggle="modal"
                data-bs-target="."
                title="Verificar no site da CNIB">
            <i class="icon feather icon-search"></i> Verificar CNIB
        </button>
        <a href="#protocolo_detail"
           class="btn btn-sm btn-outline-warning text-dark "
           title="Clique para voltar ao topo da página"
           type="button"
           data-bs-toggle="tooltip"><i class="icon feather icon-corner-left-up"></i>Voltar</a>
        <a href="#itens_pedido_pendencias"
           class="btn btn-sm btn-outline-primary text-dark "
           title="Próximo ítem"
           type="button"
           data-bs-toggle="tooltip"><i class="icon feather icon-corner-right-down"></i>Próximo</a>
    </div>
</div>
