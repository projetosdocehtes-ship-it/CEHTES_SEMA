{% extends "layouts/base.html" %}
{% load static %}
{% block content %}
  <div class="row">
    <div class="col-lg-12">
      <div class="card">
        <div class="card-header">
          <h5>
            <span class="font-weight f-20 text-light">Mensagem: Finalizado Exigência deste Ato.</span>
          </h5>
        </div>
        <div class="card-block">
          {% comment %} <form method="post">
            {% csrf_token %}
            <p>Tem certeza que deseja deletar este template?</p>
            <button type="submit" class="btn btn-danger">Deletar</button>
            <a href="{% url 'minuta_exigencia:desvincular_minuta_exigencia_ato' uuid=object.pk %}" class="btn btn-sm btn-secondary">Cancelar</a>
          </form> {% endcomment %}
        </div>
      </div>
    </div>
  </div>
{% endblock content %}
