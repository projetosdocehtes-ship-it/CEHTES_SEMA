{% extends "layouts/base.html" %}
{% load static %}
{% block content %}
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <div class="card">
          <div class="card-header">
            <h5>Vincular - Ato com Exigência</h5>
          </div>
          <div class="card-block table-border-style">
            <form action=".", method="post">
              {% csrf_token %}
              {{ form.as_p }}
              <button type="submit" class="btn btn-sm btn-primary">
                <i class="icon feather icon-check-circle"></i>Salvar
              </button>
              {% comment %} <a href="{{ request.META.HTTP_REFERER }}" class="btn btn-sm btn-secondary">Voltar</a> {% endcomment %}
              <a class="btn btn-sm btn-warning text-dark
                        title="Voltar para a página anterior sem alterar os dados."
                                                                             data-bs-toggle="tooltip"
                                         onclick="getVoltar()"><i class="icon feather icon-corner-left-up"></i>Voltar</a>
                                                                                  <script>
                                                                                  function getVoltar()
                                                                                  {
                                                                                  window.history.back()
                                                                                  window.history.back()
                                                                                  }
                                                                                  </script>
                                                                                  </form>
                                                                                  </div>
                                                                                  </div>
                                                                                  </div>
                                                                                  </div>
                                                                                  </div>
                                                                    {% endblock content %}
