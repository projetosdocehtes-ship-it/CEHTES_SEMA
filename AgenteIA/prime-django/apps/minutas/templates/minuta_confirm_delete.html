{% extends "layouts/base.html" %}
{% load static %}
{% block content %}
  <div class="row">
    <div class="col-lg-12">
      <div class="card">
        <div class="card-header">
          <h5>Deletar Template: {{ object.title }}</h5>
        </div>
        <div class="card-block">
          <form method="post">
            {% csrf_token %}
            <p>Tem certeza que deseja deletar este template?</p>
            <button type="submit" class="btn btn-danger">Deletar</button>
            <a href="{% url 'template_list' %}" class="btn btn-sm btn-secondary">Cancelar</a>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock content %}
