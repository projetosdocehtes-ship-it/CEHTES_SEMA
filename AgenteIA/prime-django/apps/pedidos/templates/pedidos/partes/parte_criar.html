{% extends "layouts/base.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block breadcrumbs %}
{% endblock breadcrumbs %}
{% block content %}
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header">
                    <h5>Adicionar Parte ao Ato {{ form.ato }}</h5>
                </div>
                <div class="card-body">{% crispy form %}</div>
                <div class="card-footer">
                    <div class="row">
                        <div class="col-lg-auto">
                            <a href="{{ form.pedido.get_absolute_url }}"
                               class="btn btn-sm btn-secondary"><i class="fas fa-newspaper d-none d-md-inline-block"></i> Ver Pedido</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
