{% extends "layouts/base.html" %}
{% load static %}
{% block content %}
  <div class="container">
    <div class="row">
      <div class="col-lg-6">
        <div class="card">
          <div class="card-header">
            <h5>Adicionar/Alterar</h5>
          </div>
          <div class="card-block table-border-style">
            <form method="post">
              {% csrf_token %}
              {{ form.as_p }}
              <button type="submit" class="btn btn-sm btn-primary">Salvar</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock content %}
