<!-- modal-base.html -->
<div class="modal fade"
     id="instrucoesModal"
     tabindex="-1"
     role="dialog"
     aria-labelledby="instrucoesModalLabel"
     aria-hidden="true">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="instrucoesModalLabel">Instruções</h5>
        <button type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Fechar">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body" id="instrucoesModalBody">
        <!-- Conteúdo das instruções aqui -->
      </div>
      <div class="modal-footer">
        <button type="button"
                class="btn btn-sm btn-secondary"
                data-bs-dismiss="modal">Fechar</button>
      </div>
    </div>
  </div>
</div>
