{% extends "layouts/base.html" %}
{% load static %}
{% block content %}
  <div class="row">
    <div class="col-lg-12">
      <div class="card">
        <div class="card-header">
          <h5>
            {% if object %}
              Editar
            {% else %}
              Novo
            {% endif %}
            Template
          </h5>
        </div>
        <div class="card-block">
          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-sm btn-primary">Salvar</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock content %}
