{% extends "layouts/base.html" %}
{% load static %}
{% block content %}
  <div class="row">
    <div class="col-lg-12">
      <div class="card">
        <div class="card-header">
          <h5>Lista de Templates</h5>
        </div>
        <div class="card-block table-border-style">
          <!-- A tabela de templates será renderizada aqui -->
          {% render_table table %}
        </div>
        <div class="card-footer">
          <a href="{% url 'template_create' %}" class="btn btn-sm btn-primary">Novo Template</a>
        </div>
      </div>
    </div>
  </div>
{% endblock content %}
