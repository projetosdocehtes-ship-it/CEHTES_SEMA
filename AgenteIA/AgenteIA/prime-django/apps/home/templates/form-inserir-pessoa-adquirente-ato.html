{% comment %} {% load widget_tweaks %} {% endcomment %}
{% comment %} <!--   --> {% endcomment %}
{% block content %}
    <!-- Modal -->
    <div class="modal"
         id="addAdquirenteModalAto"
         tabindex="-1"
         aria-labelledby="addAdquirenteModalLabelAto"
         aria-hidden="True">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addAdquirenteModalLabelAto">
                        <i class="icon feather icon-plus"></i>   Cadastrar Pessoa - Adquirente
                    </h5>
                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Fechar">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <!-- PASSANDO O PROTOCOLO DO AQUIRENTE -->
                <form action="{% url 'home:nova_pessoa' pedido_item_id=pedido_item_id opcao_parte='A' %}"
                      method="post">
                    <!-- Não se esqueça dessa tag -->
                    {% csrf_token %}
                    <div class="modal-body">
                        <!-- PASSANDO O PROTOCOLO -->
                        <input type="hidden"
                               name="parte_id"
                               id="parte_id"
                               value="{{ pedido_item_id }}" />
                        <input type="hidden" name="opcao_parte"    id="opcao_parte"    value="A" />
                        <!-- CPF -->
                        <div class="input-group mb-3">
                            <div class="input-group-prepend">
                                <span class="input-group-text">CPF/CNPJ</span>
                            </div>
                            <input type="number"
                                   class="form-control"
                                   placeholder="Digite o CPF/CNPJ"
                                   name="cpf"
                                   id="cpf"
                                   value=""
                                   required>
                        </div>
                        <!-- Nome -->
                        <div class="input-group mb-3">
                            <div class="input-group-prepend">
                                <span class="input-group-text">Nome</span>
                            </div>
                            <input type="text"
                                   class="form-control"
                                   placeholder="Digite o nome"
                                   name="nome"
                                   id="nome"
                                   value=""
                                   autofocus
                                   required>
                        </div>
                        <!-- BOTOES -->
                        <div class="modal-footer">
                            <button type="submit"
                                    class="btn btn-sm btn-primary "
                                    aria-pressed="true"
                                    role="button">
                                <i class="icon feather icon-save"></i> Salvar
                            </button>
                            <button value=""
                                    type="button"
                                    class="btn btn-sm btn-secondary "
                                    data-bs-dismiss="modal">
                                <i class="btn-close"></i> Fechar
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
