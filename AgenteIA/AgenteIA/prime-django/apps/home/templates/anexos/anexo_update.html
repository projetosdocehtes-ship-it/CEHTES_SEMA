{% extends "layouts/base.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block breadcrumbs %}
{% endblock breadcrumbs %}
{% block content %}
    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-header">
                    <h5>Editar Informações do Arquivo</h5>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {{ form | crispy }}
                        <button type="submit" class="btn btn-sm btn-primary">Salvar</button>
                    </form>
                    {% comment %} <a href="{% url 'ged:arquivo_download' pk=arquivo.id %}" class="btn btn-sm btn-primary">Download</a> {% endcomment %}
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-6">
            <a href="{% url 'ged:arquivos_list' %}" class="btn btn-sm btn-primary">Listar Arquivos</a>
        </div>
    </div>
{% endblock content %}
