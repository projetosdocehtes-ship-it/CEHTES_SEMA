{% block content %}
    <!-- Modal -->
    <div class="modal"
         id="addImportarImovelNumero"
         tabindex="-1"
         aria-labelledby="addImovelModalLabel"
         aria-hidden="True">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"
                        id="addImovelModalLabel"
                        style="background-color: #474747;
                               color: #FFFFFF">Importar Imóvel ou Registro Auxiliar por Número&emsp;</h5>
                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close">
                        <span aria-hidden="true">×</span>
                    </button>
                </div>
                <!-- PASSANDO O -->
                <form action="{% url 'home:importar_imovel_numero_view' %}"
                      method="post"
                      href=".">
                    <!-- Não se esqueça dessa tag -->
                    {% csrf_token %}
                    <div class="modal-body">
                        <div class="input-group mb-12">
                            <span class="input-group-text">Tipo&ensp;&ensp;&ensp;&ensp;</span>
                            <select class="form-select" name="tipo_registro" id="tipo_registro" required>
                                <option value="M" selected>Matrícula</option>
                                <option value="T">Transcrição</option>
                                <option value="I">Inscrição</option>
                                <option value="A">Registro Auxiliar</option>
                            </select>
                        </div>
                        <div class="input-group mb-12">
                            <span class="input-group-text">Número</span>
                            <input type="number"
                                   class="form-control"
                                   placeholder="digite o número inicial"
                                   name="numero_i"
                                   id="numero_i"
                                   value="0"
                                   required>
                            <input type="number"
                                   class="form-control"
                                   placeholder="digite o número final"
                                   name="numero_f"
                                   id="numero_f"
                                   value="0"
                                   required>
                        </div>
                        <div class="input-group mb-12">
                            <span class="input-group-text">RI&emsp;&emsp;&emsp;</span>
                            <input type="number"
                                   class="form-control"
                                   placeholder="digite o número cartório"
                                   name="cartorio_ri"
                                   id="cartorio_ri"
                                   value="1"
                                   required>
                        </div>
                    </div>
                    <!-- BOTOES -->
                    <div class="modal-footer">
                        <button type="submit"
                                class="btn btn-sm btn-primary "
                                aria-pressed="true"
                                role="button">
                            <i class="icon feather icon-save"></i> Importar
                        </button>
                        <button value=""
                                type="button"
                                class="btn btn-sm btn-secondary "
                                data-bs-dismiss="modal">
                            <i class="btn-close"></i> Fechar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
        $(document).ready(function() {
            $("#addImportarImovelNumero").on('shown.bs.modal', function() {
                $(this).find('#numero_i').focus();
            });
        });
    </script>
{% endblock %}
