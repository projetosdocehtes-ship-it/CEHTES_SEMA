{% extends "layouts/base.html" %}
{% block content %}
    <div class="container mt-4">
        <h3>Confirmação de Exclusão</h3>
        <p>
            Você tem certeza de que deseja excluir: <b>{{ object.tipo_certidao.nome }}</b>?
        </p>
        <form method="post">
            {% csrf_token %}
            <input type="submit" value="Confirmar Exclusão" class="btn btn-danger">
            {% comment %} <a href="{% url 'home:pedido_certidao_listar_certidoes_pedido' view.kwargs.pedido_id %}" class="btn btn-sm btn-secondary">Cancelar</a> {% endcomment %}
        </form>
    </div>
{% endblock %}
