{% load home_formatos %}
<!-- Modal -->
<div class="modal" id="myModal{{ transmitente.id }}" role="dialog">
    <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header bg-dark">
                <h4 class="modal-title text-white" id="myModalLabel">
                    <i class="icon feather icon-edit"></i>  Alterando dados para o Transmitentes:
                    <p>{{ transmitente.pessoa.nome }} - {{ transmitente.pessoa.cpf|default:""|formatar_documento }}</p>
                </h4>
                <button class="close text-white" data-bs-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form action={% url 'home:editModalAtoParteT' %} method="post">
                    {% csrf_token %}
                    <input type="hidden" name="parte_idT" value="{{ transmitente.id }} " />
                    <input type="hidden"
                           name="pedido_item_idT"
                           value="{{ transmitente.pedido_item_id }}" />
                    <!-- OBTER O COMBOBOX DOS ATOS DA MATRICULA -->
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text">Número do Ato (baixar)</span>
                        </div>
                        <select class="form-select" name="ato_transmitir" id="ato_transmitir">
                            <option value="{{ transmitente.pedido_item_id|get_partes_do_pedido }}"
                                    selected>{{ transmitente.pedido_item_id|get_partes_do_pedido }}</option>
                            {% if transmitente.pedido_item_id|get_vinculos_livro02 %}
                                {% for pedido_item in transmitente.pedido_item_id|get_vinculos_livro02 %}
                                    <option value="{{ pedido_item.0 }}">
                                        {{ pedido_item.1 }}.{{ pedido_item.2|numero_inteiro }}
                                        {{ pedido_item.3 }} {{ pedido_item.4|get_cpf|formatar_documento }} {{ pedido_item.4|get_nome_da_pessoa_pelo_id }}
                                    </option>
                                {% endfor %}
                            {% else %}
                            {% endif %}
                        </select>
                    </div>
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text">Informe o Percentual do ATO</span>
                        </div>
                        <input type="text"
                               class="form-control"
                               name="percentual_ato"
                               id="percentual_ato"
                               placeholder="Informe o Percentual do ATO"
                               value="{{ transmitente.percentual_ato }}"
                               autofocus
                               required="true"
                               oninput="this.value=this.value.replace(/[^0-9,]/g, '').replace(/(\..*?)\..*/g, '$1');" />
                    </div>
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text">Informe o Percentual para a DOI</span>
                        </div>
                        <input type="text"
                               class="form-control"
                               name="percentual_doi"
                               id="percentual_doi"
                               placeholder="Informe o Percentual para a DOI"
                               value="{{ transmitente.percentual_doi }}"
                               autofocus
                               required="true"
                               oninput="this.value=this.value.replace(/[^0-9,]/g, '').replace(/(\..*?)\..*/g, '$1');" />
                    </div>
                    <!-- OBTER O COMBOBOX DO CONJUGUE -->
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="form-group">
                                <div class="input-group mb-6">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text">Conjugue</span>
                                    </div>
                                    <select class="form-select" name="conjuge" id="conjuge">
                                        {% if transmitente.pessoa_conjuge_id > 0 %}
                                            <option value="{{ transmitente.pessoa_conjuge_id }}">{{ transmitente.pessoa_conjuge.nome }}</option>
                                        {% else %}
                                            <option value="0"></option>
                                        {% endif %}
                                        {% if transmitente.pedido_item_id != None %}
                                            {% for transmitente in transmitente.pedido_item_id|get_partes_do_pedido %}
                                                <option value="{{ transmitente.pessoa }}">{{ transmitente.pessoa.nome }}</option>
                                            {% endfor %}
                                        {% endif %}
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit"
                                class="btn btn-sm btn-primary"
                                aria-label="Salvar as alterações">
                            <i class="icon feather icon-save"></i> Salvar
                        </button>
                        <button class="btn btn-sm btn-secondary"
                                data-bs-dismiss="modal"
                                aria-label="Fechar o modal">
                            <i class="btn-close"></i> Fechar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
