{% extends "layouts/base.html" %}
{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Agente FV{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'fotovoltaico/css/styles.css' %}" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'fotovoltaico:index' %}">☀️ Agente FV</a>
    {% comment %} <div>
      <a class="nav-link d-inline text-white" href="{% url 'fotovoltaico:quantas_placas' %}">Quantas placas</a>
      <a class="nav-link d-inline text-white" href="{% url 'fotovoltaico:ranking_empresas' %}">Ranking empresas</a>
      <a class="nav-link d-inline text-white" href="{% url 'fotovoltaico:perguntas_list' %}">Perguntas</a>
    </div> {% endcomment %}
  </div>
</nav>
<main class="container">
  {% if messages %}
    <div class="mt-2">
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
      {% endfor %}
    </div>
  {% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
