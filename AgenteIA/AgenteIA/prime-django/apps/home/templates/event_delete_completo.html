{% extends "layouts/base.html" %}
{% load static %}
{% comment %} {% load widget_tweaks %} {% endcomment %}
{% load home_formatos %}
<!-- [ Main Content ] start -->
<div class="pcoded-main-container">
    <div class="pcoded-wrapper">
        <div class="pcoded-content">
            <div class="pcoded-inner-content">
                <div class="main-body">
                    <div class="page-wrapper">
                        <form action="" method="post">
                            {% csrf_token %}
                            <!--        INICIO DA FICHA DE CHECKLIST        -->
                            {% block content %}
                                <form action="" method="post">
                                    <div class="card" id="card_membro">
                                        <div class="card-header">
                                            <span class="font-weight f-22 text-light">Cancelar este Evento:
                                                Tem certeza de que deseja cancelar este evento ?
                                            </span>
                                        </div>
                                    </div>
                                    {% csrf_token %}
                                    <a class="btn btn-warning btn-lg text-dark active"
                                       title="Voltar para a página anterior sem alterar os dados."
                                       data-bs-toggle="tooltip"
                                       onclick="getVoltar()">Voltar</a>
                                    <button class="btn btn-danger ml-2"
                                            type="submit"
                                            title="Cancelar o evento PERMANENTE"
                                            data-bs-toggle="tooltip">
                                        <i class="icon feather icon-delete"></i>Confirmar
                                    </button>
                                </form>
                                <script>
                                    function getVoltar() {
                                        window.history.back()
                                    }
                                </script>
                            {% endblock content %}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!--   #######     FIM DA FICHA DE CHECKLIST   #######     -->
</body>
</html>
