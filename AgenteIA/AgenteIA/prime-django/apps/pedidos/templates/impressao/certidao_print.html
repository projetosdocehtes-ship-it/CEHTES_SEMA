{% extends "impressao/base_A4.html" %}
{% block stylesheets %}
  <style>
    .no-print {
      display: none; /* Elementos que não devem aparecer na impressão */
    }
  </style>
{% endblock %}
{% block content %}
  <div class="container mt-5">
    <div class="row">
      <div class="col-12">
        <!-- Botão para acionar a impressão -->
        <button class="btn btn-sm btn-primary no-print" onclick="window.print()">Imprimir ato</button>
      </div>
    </div>
    <div class="row mt-5">
      <div class="col-12">
        <!-- Cabeçalho da ato -->
        <h2 class="text-center">ato</h2>
        <hr>
      </div>
    </div>
    <div class="row mt-3">
      <div class="col-12">
        <!-- Conteúdo da ato -->
        <p>
          <strong>Nome:</strong> {{ ato.nome }}
        </p>
        <p>
          <strong>Documento:</strong> {{ ato.documento_formatado }}
        </p>
        <!-- Adicione mais campos conforme necessário -->
      </div>
    </div>
    <div class="row mt-5">
      <div class="col-12">
        <!-- Rodapé da ato, se necessário -->
        <p class="text-center">Este é um documento oficial emitido por [Nome do Cartório].</p>
      </div>
    </div>
  </div>
{% endblock %}
