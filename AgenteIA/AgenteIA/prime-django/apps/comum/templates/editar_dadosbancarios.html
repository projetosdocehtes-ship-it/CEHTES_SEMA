{% extends "layouts/base.html" %}
{% load static crispy_forms_tags %}
{% block content %}
  <div class="row">
    <div class="col-lg-6">
      <div class="card">
        <div class="card-header">
          <h5>Editar</h5>
        </div>
        <div class="card-block">
          <form action="." method="post">
            {% csrf_token %}
            {% crispy form %}
            <button type="submit" class="btn btn-sm btn-primary">Atualizar</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock content %}
