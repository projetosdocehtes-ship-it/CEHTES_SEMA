{% extends "layouts/base.html" %}
{% load static %}
{% block stylesheets %}
    <style>
        .document-editor {
            border: 1px solid var(--ck-color-base-border);
            border-radius: var(--ck-border-radius);
            max-height: 700px;
            display: flex;
            flex-flow: column nowrap;
        }

        .document-editor__toolbar {
            z-index: 1;
            box-shadow: 0 0 5px hsla(0, 0%, 0%, .2);
            border-bottom: 1px solid var(--ck-color-toolbar-border);
        }

        .document-editor__toolbar .ck-toolbar {
            border: 0;
            border-radius: 0;
        }

        .document-editor__editable-container {
            padding: calc(2 * var(--ck-spacing-large));
            background: #eee;
            overflow-y: scroll;
        }

        .document-editor__editable-container .ck-editor__editable.ck-editor__editable_inline {
            width: 21cm;
            min-height: 29.7cm;

          /* Margem de configuracao da ficha em cm */
            padding-left: 2.0cm;
          /* Margem esquerda de 4cm */
            padding-right: 2.0cm;
          /* Margem direita de 2cm */
            padding-top: 0.5cm;
          /* Margem superior de 1cm */
            padding-bottom: 2cm;
          /* Margem inferior de 1cm */

            font-family: "Courier New", Courier, monospace;
          /* Definindo a fonte */
            font-size: 10pt;
          /* Definindo o tamanho da fonte */

            border: 1px hsl(0, 0%, 82.7%) solid;
            border-radius: var(--ck-border-radius);
            background: white;
            box-shadow: 0 0 5px hsla(0, 0%, 0%, .1);
            margin: 0 auto;
        }

        .document-editor .ck-content,
        .document-editor .ck-heading-dropdown .ck-list .ck-button__label {
            font: 16px/1.6 "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        .document-editor .ck-heading-dropdown .ck-list .ck-button__label {
            line-height: calc(1.7 * var(--ck-line-height-base) * var(--ck-font-size-base));
            min-width: 6em;
        }

        .document-editor .ck-heading-dropdown .ck-list .ck-button:not(.ck-heading_paragraph) .ck-button__label {
            transform: scale(0.8);
            transform-origin: left;
        }

        .document-editor .ck-content h2,
        .document-editor .ck-heading-dropdown .ck-heading_heading1 .ck-button__label {
            font-size: 2.18em;
            font-weight: normal;
        }

        .document-editor .ck-content h2 {
            line-height: 1.37em;
            padding-top: .342em;
            margin-bottom: .142em;
        }

        .document-editor .ck-content h3,
        .document-editor .ck-heading-dropdown .ck-heading_heading2 .ck-button__label {
            font-size: 1.75em;
            font-weight: normal;
            color: hsl(203, 100%, 50%);
        }

        .document-editor .ck-heading-dropdown .ck-heading_heading2.ck-on .ck-button__label {
            color: var(--ck-color-list-button-on-text);
        }

        .document-editor .ck-content h3 {
            line-height: 1.86em;
            padding-top: .171em;
            margin-bottom: .357em;
        }

        .document-editor .ck-content h4,
        .document-editor .ck-heading-dropdown .ck-heading_heading3 .ck-button__label {
            font-size: 1.31em;
            font-weight: bold;
        }

        .document-editor .ck-content h4 {
            line-height: 1.24em;
            padding-top: .286em;
            margin-bottom: .952em;
        }

        .document-editor .ck-content p {
            padding-top: -.5em;
            margin-bottom: -.5em;
        }

        .document-editor .ck-content blockquote {
            font-family: Georgia, serif;
            margin-left: calc(2 * var(--ck-spacing-large));
            margin-right: calc(2 * var(--ck-spacing-large));
        }
    </style>
{% endblock stylesheets %}
{% block content %}
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="card">
                    <div class="card-header">
                        <h5>Editar Minuta Exigência</h5>
                    </div>
                    <div class="card-block table-border-style">
                        <form action="." method="post">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <button type="submit" class="btn btn-sm btn-primary">Salvar</button>
                            <a class="btn btn-sm btn-warning text-dark"
                               title="Voltar para a página anterior sem alterar os dados."
                               data-bs-toggle="tooltip"
                               onclick="getVoltar()"><i class="icon feather icon-corner-left-up"></i>Voltar</a>
                            <script> function getVoltar() { window.history.back() } </script>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
{% block javascripts %}
    <script src="https://cdn.ckeditor.com/4.16.1/standard/ckeditor.js"></script>
    <!-- Ckeditor js -->
    <script src="{% static 'assets/js/plugins/ckeditor5/document/ckeditor.js' %}"></script>
    <script type="text/javascript">
        (function () {
            DecoupledEditor.create(document.querySelector('.document-editor__editable'))
                .then(editor => {
                    const toolbarContainer = document.querySelector('.document-editor__toolbar');
                    toolbarContainer.appendChild(editor.ui.view.toolbar.element);
                })
                .catch(error => {});
        })();
    </script>
    <script>
        CKEDITOR.replace('observacao_id', {
            skin: 'moono',
            toolbar_Basic: [["Bold", "Italic", "Underline"], ["NumberedList", "BulletedList", "-", "Outdent", "Indent", "-", "JustifyLeft", "JustifyCenter", "JustifyRight", "JustifyBlock"], ["RemoveFormat"], ["-", "Save", "Preview", "Print", "-", "Maximize", "ShowBlocks"], ["Image", "Flash", "Table", "HorizontalRule", "Smiley", "SpecialChar", "PageBreak", "Iframe"]],
            toolbar_Full: [["Styles", "Format", "Bold", "Italic", "Underline", "Strike", "SpellChecker", "Undo", "Redo"], ["Link", "Unlink", "Anchor"], ["Image", "Flash", "Table", "HorizontalRule"], ["TextColor", "BGColor"], ["Smiley", "SpecialChar"]],
            toolbar: 'full',
            height: 291,
            width: '100%',
            filebrowserWindowWidth: 940,
            filebrowserWindowHeight: 725,
            frame: 'border',
            toolbar_Custom: [["Bold", "Italic", "Underline"], ["NumberedList", "BulletedList", "-", "Outdent", "Indent", "-", "JustifyLeft", "JustifyCenter", "JustifyRight", "JustifyBlock"], ["Link", "Unlink"], ["RemoveFormat"]],
            removePlugins: 'about,newpage,sourcearea,save',
            scayt_autoStartup: true,
            scayt_sLang: 'pt_BR',
            language: 'pt-br'
        });

    </script>
{% endblock javascripts %}
