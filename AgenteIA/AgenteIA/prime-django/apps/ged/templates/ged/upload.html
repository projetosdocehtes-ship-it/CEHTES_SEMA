{% extends "layouts/base.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block breadcrumbs %}
{% endblock breadcrumbs %}
{% block content %}
    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-header">
                    <h5>Upload de Arquivos</h5>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-sm btn-primary">Upload</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-6">
            <a href="{% url 'ged:arquivos_list' %}" class="btn btn-sm btn-primary">Listar Arquivos</a>
        </div>
    </div>
{% endblock content %}
