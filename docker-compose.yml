version: "3.8"
services:
  appcartorios-app:
    container_name: appcartorios_app
    restart: always
    build: .
    volumes:
      - ./:/app
    networks:
      - db_network
      - web_network
  nginx:
    container_name: nginx
    restart: always
    image: "nginx:latest"
    ports:
      - "5085:5085"
    volumes:
      - ./nginx:/etc/nginx/conf.d
    networks:
      - web_network
    depends_on:
      - appcartorios-app
  db:
    image: postgres
    environment:
      POSTGRES_DB: exemplo
      POSTGRES_USER: user
      POSTGRES_PASSWORD: senha
networks:
  db_network:
    driver: bridge
  web_network:
    driver: bridge
